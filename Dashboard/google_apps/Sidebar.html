<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f9fafb;
        color: #1f2937;
        margin: 0;
        padding: 16px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 12px 0;
        color: #441A80;
      }
      .section {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 12px;
      }
      label {
        display: block;
        font-size: 12px;
        color: #6A7282;
        margin-bottom: 4px;
      }
      input, select, button {
        width: 100%;
        box-sizing: border-box;
        border-radius: 8px;
        border: 1px solid #d1d5db;
        padding: 8px 10px;
        margin-bottom: 10px;
      }
      button {
        background: #441A80;
        color: #ffffff;
        border: none;
        cursor: pointer;
        font-weight: bold;
      }
      button.secondary {
        background: #ffffff;
        color: #441A80;
        border: 1px solid #441A80;
      }
      .status {
        font-size: 12px;
        color: #6A7282;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .row > * {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <h1>Monitoramento</h1>

    <div class="section">
      <div class="status" id="ultimaAtualizacao">Carregando...</div>
    </div>

    <div class="section">
      <label for="dataInicial">Data inicial</label>
      <input id="dataInicial" type="date">

      <label for="dataFinal">Data final</label>
      <input id="dataFinal" type="date">

      <label for="granularidade">Granularidade</label>
      <select id="granularidade"></select>

      <label for="filial">Filial</label>
      <select id="filial"></select>

      <label for="transportadora">Transportadora</label>
      <select id="transportadora"></select>

      <label for="tipoVeiculo">Tipo de veículo</label>
      <select id="tipoVeiculo"></select>

      <label for="status">Status</label>
      <select id="status"></select>

      <label for="modoComparacao">Modo de comparação</label>
      <select id="modoComparacao"></select>

      <button onclick="salvarFiltros()">Aplicar filtros</button>
      <button class="secondary" onclick="executarAcao('resetar')">Resetar filtros</button>
    </div>

    <div class="section">
      <button class="secondary" onclick="executarAcao('reconstruir')">Reconstruir painéis</button>
      <button class="secondary" onclick="executarAcao('atualizar_tudo')">Atualizar tudo</button>
    </div>

    <div class="section">
      <div class="row">
        <button class="secondary" onclick="irPara('PAINEL_GERENCIAL')">Gerencial</button>
        <button class="secondary" onclick="irPara('PAINEL_OPERACIONAL')">Operacional</button>
      </div>
      <button class="secondary" onclick="irPara('DRILLDOWN_ANALITICO')">Abrir Drilldown</button>
    </div>

    <script>
      function preencherSelect(id, valores, selecionado) {
        const select = document.getElementById(id);
        select.innerHTML = '';
        (valores || []).forEach(valor => {
          const option = document.createElement('option');
          option.value = valor;
          option.textContent = valor;
          if (valor === selecionado) option.selected = true;
          select.appendChild(option);
        });
      }

      function carregar() {
        google.script.run.withSuccessHandler(state => {
          document.getElementById('dataInicial').value = state.config.dataInicial || '';
          document.getElementById('dataFinal').value = state.config.dataFinal || '';
          preencherSelect('granularidade', state.lists.granularidades, state.config.granularidade);
          preencherSelect('filial', state.lists.filiais, state.config.filial);
          preencherSelect('transportadora', state.lists.transportadoras, state.config.transportadora);
          preencherSelect('tipoVeiculo', state.lists.tiposVeiculo, state.config.tipoVeiculo);
          preencherSelect('status', state.lists.statuses, state.config.status);
          preencherSelect('modoComparacao', state.lists.modosComparacao, state.config.modoComparacao);
          document.getElementById('ultimaAtualizacao').textContent =
            'Última atualização: ' + (state.ultimaAtualizacao || 'não registrada');
        }).panelGetSidebarState_();
      }

      function salvarFiltros() {
        const payload = {
          dataInicial: document.getElementById('dataInicial').value,
          dataFinal: document.getElementById('dataFinal').value,
          granularidade: document.getElementById('granularidade').value,
          filial: document.getElementById('filial').value,
          transportadora: document.getElementById('transportadora').value,
          tipoVeiculo: document.getElementById('tipoVeiculo').value,
          status: document.getElementById('status').value,
          modoComparacao: document.getElementById('modoComparacao').value
        };

        google.script.run.withSuccessHandler(() => carregar()).panelSalvarFiltrosSidebar_(payload);
      }

      function executarAcao(actionName) {
        google.script.run.withSuccessHandler(() => carregar()).panelAcaoSidebar_(actionName);
      }

      function irPara(sheetName) {
        google.script.run.panelIrParaAba_(sheetName);
      }

      carregar();
    </script>
  </body>
</html>
