name: "🏥 Health Check"

on:
  schedule:
    - cron: "0 11 * * 1-5" # Seg-Sex 8h BRT (11 UTC)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar estrutura do projeto
        id: check_dirs
        run: |
          echo "=== Verificando estrutura canônica ==="
          MISSING=()
          for dir in Dashboard/bigquery Dashboard/extraction Dashboard/config Dashboard/google_apps Dashboard/api Dashboard/frontend Dashboard/docs scripts .github/agents .github/instructions .github/prompts; do
            if [ ! -d "$dir" ]; then
              MISSING+=("$dir")
            fi
          done

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "❌ Diretórios ausentes: ${MISSING[*]}"
            echo "status=FAIL" >> $GITHUB_OUTPUT
          else
            echo "✅ Estrutura de diretórios OK"
            echo "status=OK" >> $GITHUB_OUTPUT
          fi

      - name: Verificar arquivos críticos
        id: check_files
        run: |
          echo "=== Verificando arquivos críticos ==="
          MISSING=()
          for f in Dashboard/bigquery/pipeline_dashboard_v7.sql Dashboard/bigquery/deploy_v7_dashboard.py Dashboard/bigquery/load_raw_to_bq.py Dashboard/extraction/consolidar_monitoramento.py Dashboard/api/queries.js Dashboard/api/server.js scripts/daily_pipeline.ps1 AGENTS.md; do
            if [ ! -f "$f" ]; then
              MISSING+=("$f")
            fi
          done

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "⚠️ Arquivos ausentes: ${MISSING[*]}"
            echo "status=WARN" >> $GITHUB_OUTPUT
            echo "missing_files=${MISSING[*]}" >> $GITHUB_OUTPUT
          else
            echo "✅ Arquivos críticos OK"
            echo "status=OK" >> $GITHUB_OUTPUT
          fi

      - name: Contar objetos SQL
        id: count_sql
        run: |
          echo "=== Contagem de objetos SQL ==="
          V7_COUNT=$(grep -c "^CREATE OR REPLACE" Dashboard/bigquery/pipeline_dashboard_v7.sql 2>/dev/null || echo 0)
          echo "Pipeline v7: $V7_COUNT statements"
          echo "sql_v7=$V7_COUNT" >> $GITHUB_OUTPUT

      - name: Criar issue se houver problemas
        if: ${{ steps.check_dirs.outputs.status == 'FAIL' || steps.check_files.outputs.status == 'WARN' }}
        env:
          HEALTH_DIRS: ${{ steps.check_dirs.outputs.status }}
          HEALTH_FILES: ${{ steps.check_files.outputs.status }}
          MISSING_FILES: ${{ steps.check_files.outputs.missing_files }}
          SQL_V7: ${{ steps.count_sql.outputs.sql_v7 }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🏥 Health Check — ${new Date().toISOString().split('T')[0]}`;
            const body = `## Health Check Automático\n\n` +
              `| Check | Status |\n|-------|--------|\n` +
              `| Diretórios | ${process.env.HEALTH_DIRS} |\n` +
              `| Arquivos críticos | ${process.env.HEALTH_FILES} |\n` +
              `| SQL v7 statements | ${process.env.SQL_V7} |\n\n` +
              (process.env.MISSING_FILES ? `**Arquivos ausentes:** ${process.env.MISSING_FILES}\n` : '');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['type: bug', 'priority: high', 'domain: infra']
            });
