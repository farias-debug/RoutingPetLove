name: "🧪 Validate SQL"

on:
  push:
    paths:
      - "Dashboard/bigquery/**/*.sql"
  pull_request:

permissions:
  contents: read

jobs:
  validate-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Contar statements SQL
        run: |
          echo "=== Pipeline v7 ==="
          V7=$(grep -c "^CREATE OR REPLACE" Dashboard/bigquery/pipeline_dashboard_v7.sql 2>/dev/null || echo 0)
          echo "Statements: $V7"
          echo ""
          echo "Total: $V7 objetos SQL (pipeline v7 canônico)"

      - name: Verificar sintaxe básica SQL
        run: |
          echo "=== Verificando parênteses e aspas ==="
          ERRORS=0
          for f in Dashboard/bigquery/*.sql; do
            # Verificar parênteses balanceadas
            OPEN=$(grep -o '(' "$f" | wc -l)
            CLOSE=$(grep -o ')' "$f" | wc -l)
            if [ "$OPEN" != "$CLOSE" ]; then
              echo "⚠️ $f: parênteses desbalanceadas (abertas: $OPEN, fechadas: $CLOSE)"
              ERRORS=$((ERRORS + 1))
            fi

            # Verificar backticks balanceadas
            TICKS=$(grep -o '`' "$f" | wc -l)
            if [ $((TICKS % 2)) -ne 0 ]; then
              echo "⚠️ $f: backticks ímpares ($TICKS)"
              ERRORS=$((ERRORS + 1))
            fi
          done

          if [ $ERRORS -gt 0 ]; then
            echo "❌ $ERRORS erros encontrados"
            exit 1
          else
            echo "✅ Sintaxe básica OK"
          fi
