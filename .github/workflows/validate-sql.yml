name: "🧪 Validate SQL"

on:
  push:
    paths:
      - "Dashboard/bigquery/**/*.sql"
  pull_request:

permissions:
  contents: read

jobs:
  validate-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Contar statements SQL
        run: |
          echo "=== Pipeline v4 ==="
          V4=$(grep -c "^CREATE OR REPLACE" Dashboard/bigquery/pipeline_v4.sql 2>/dev/null || echo 0)
          echo "Statements: $V4"

          echo "=== Pipeline v5 ==="
          V5=$(grep -c "^CREATE OR REPLACE" Dashboard/bigquery/pipeline_v5_publicacao.sql 2>/dev/null || echo 0)
          echo "Statements: $V5"

          echo "=== Pipeline v6 ==="
          V6=0
          if [ -f Dashboard/bigquery/pipeline_v6_api.sql ]; then
            V6=$(grep -c "^CREATE OR REPLACE" Dashboard/bigquery/pipeline_v6_api.sql || echo 0)
          fi
          echo "Statements: $V6"

          echo ""
          echo "Total: $((V4 + V5 + V6)) objetos SQL"

      - name: Verificar sintaxe básica SQL
        run: |
          echo "=== Verificando parênteses e aspas ==="
          ERRORS=0
          for f in Dashboard/bigquery/*.sql; do
            # Verificar parênteses balanceadas
            OPEN=$(grep -o '(' "$f" | wc -l)
            CLOSE=$(grep -o ')' "$f" | wc -l)
            if [ "$OPEN" != "$CLOSE" ]; then
              echo "⚠️ $f: parênteses desbalanceadas (abertas: $OPEN, fechadas: $CLOSE)"
              ERRORS=$((ERRORS + 1))
            fi

            # Verificar backticks balanceadas
            TICKS=$(grep -o '`' "$f" | wc -l)
            if [ $((TICKS % 2)) -ne 0 ]; then
              echo "⚠️ $f: backticks ímpares ($TICKS)"
              ERRORS=$((ERRORS + 1))
            fi
          done

          if [ $ERRORS -gt 0 ]; then
            echo "❌ $ERRORS erros encontrados"
            exit 1
          else
            echo "✅ Sintaxe básica OK"
          fi
